<template>
    <lightning-card title="Appointments">
        <div class="slds-p-around_medium">
            <template if:true={appointments}>
                <template for:each={appointments} for:item="appt">
                    <div key={appt.Id} class="slds-box slds-m-bottom_small">
                        <p><strong>Patient:</strong> {appt.Patient__r.Name}</p>
                        <p><strong>Doctor:</strong> {appt.Doctor__r.Name}</p>
                        <p><strong>Date & Time:</strong> {appt.Date__c}</p>
                    </div>
                </template>
            </template>
            <template if:false={appointments}>
                <p>No appointments found.</p>
            </template>
        </div>
    </lightning-card>
</template>
